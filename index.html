<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你是谁？</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 1. 初始伪装图片 */
            background-image: url('start.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            color: white;
            font-size: 20px;
            z-index: 999;
            cursor: pointer;
            padding-bottom: 50px;
            box-sizing: border-box;
        }

        #overlay span {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none;
        }

        /* 隐藏音频标签 */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 遮罩层 -->
    <div id="overlay">
        <span>……？</span>
    </div>

    <!-- 2. 突脸音效文件 -->
    <audio id="soundScare" src="scare_sound.mp3" preload="auto"></audio>

    <script>
        // ==================== 文件名及参数配置区域 ====================
        const fileConfig = {
            startImage: 'start.jpg',         // 初始伪装图片文件名
            scareImage1: 'scare1.jpg',       // 跳脸图片 A 文件名
            scareImage2: 'scare2.jpg',       // 跳脸图片 B 文件名
            recoverySeconds: 4               // 几秒后恢复原样（单位：秒）
        };
        // =============================================================

        // 预加载图片，防止切换时卡顿
        [fileConfig.startImage, fileConfig.scareImage1, fileConfig.scareImage2].forEach(src => {
            const img = new Image();
            img.src = src;
        });

        let hasTriggered = false;
        let flashInterval = null;

        document.getElementById('overlay').addEventListener('click', function() {
            if (hasTriggered) return;
            hasTriggered = true;

            const overlay = this;
            overlay.innerHTML = ''; 

            // 获取音效并播放
            const soundScare = document.getElementById('soundScare');
            soundScare.currentTime = 0;

            // 全屏
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();

            // 双图片高频闪烁（每 150 毫秒切换一次）
            let toggle = false;
            flashInterval = setInterval(() => {
                toggle = !toggle;
                overlay.style.backgroundImage = `url('${toggle ? fileConfig.scareImage1 : fileConfig.scareImage2}')`;
            }, 150);

            document.title = "连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️";

            // 倒计时结束恢复原样
            setTimeout(() => {
                // 清除闪烁
                clearInterval(flashInterval);

                // 停止并重置音效
                soundScare.pause();
                soundScare.currentTime = 0;

                // 恢复初始界面
                overlay.style.backgroundImage = `url('${fileConfig.startImage}')`;

                // 退出全屏
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }

                document.title = "不要再来打搅我耍起了。";
            }, fileConfig.recoverySeconds * 1000);
        });
    </script>
</body>
</html>
