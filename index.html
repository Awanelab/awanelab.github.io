<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你是谁？</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('start.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            color: white;
            font-size: 20px;
            z-index: 999;
            cursor: pointer;
            padding-bottom: 50px;
            box-sizing: border-box;
        }

        #overlay span {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <span>……？</span>
    </div>

    <script>
        // ==================== 文件名配置区域 ====================
        const fileConfig = {
            startImage: 'start.jpg',         // 1. 初始伪装图片文件
            scareImage1: 'scare1.jpg',       // 2. 跳脸图片 A 文件
            scareImage2: 'scare2.jpg',       // 3. 跳脸图片 B 文件
            scareSound: 'scare_sound.mp3',   // 4. 突脸瞬时音效文件
            loopSound: 'loop_sound.mp3',     // 5. 循环播放的音频文件
            recoverySeconds: 5               // 6. 几秒后恢复原样（单位：秒）
        };
        // ========================================================

        // 预加载音频对象
        const soundScare = new Audio(fileConfig.scareSound);
        const soundLoop = new Audio(fileConfig.loopSound);
        soundLoop.loop = true;

        // 预加载图片
        [fileConfig.startImage, fileConfig.scareImage1, fileConfig.scareImage2].forEach(src => {
            const img = new Image();
            img.src = src;
        });

        let hasTriggered = false;
        let flashInterval = null;

        document.getElementById('overlay').addEventListener('click', function() {
            if (hasTriggered) return;
            hasTriggered = true;

            const overlay = this;
            overlay.innerHTML = '';

            // 【核心修改】：解决浏览器多音频抢占问题的关键逻辑
            // 1. 先强制播放突脸音效
            soundScare.currentTime = 0;
            soundScare.play().then(() => {
                // 等突脸音效开始播的一瞬间（或利用事件），再安全地切入循环音频
                // 或者延时 200 毫秒再起循环音频，避免同一瞬间并发被浏览器拦截
                setTimeout(() => {
                    soundLoop.currentTime = 0;
                    soundLoop.play().catch(e => console.log("循环音频播放拦截", e));
                }, 100);
            }).catch(e => {
                console.log("突脸音效播放拦截", e);
                // 如果突脸被拦截，保底直接起循环音频
                soundLoop.play().catch(err => console.log(err));
            });

            // 全屏
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();

            // 双图片高频闪烁
            let toggle = false;
            flashInterval = setInterval(() => {
                toggle = !toggle;
                overlay.style.backgroundImage = `url('${toggle ? fileConfig.scareImage1 : fileConfig.scareImage2}')`;
            }, 150);

            document.title = "连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️";

            // 自动恢复
            setTimeout(() => {
                clearInterval(flashInterval);

                soundLoop.pause();
                soundLoop.currentTime = 0;
                soundScare.pause();
                soundScare.currentTime = 0;

                overlay.style.backgroundImage = `url('${fileConfig.startImage}')`;

                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }

                document.title = "……";
            }, fileConfig.recoverySeconds * 1000);
        });
    </script>
</body>
</html>
