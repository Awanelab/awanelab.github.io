<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>你是谁？</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('start.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            color: white;
            font-size: 20px;
            z-index: 999;
            cursor: pointer;
            padding-bottom: 50px;
            box-sizing: border-box;
        }

        #overlay span {
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            pointer-events: none;
        }

        /* 隐藏音频标签 */
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 遮罩层 -->
    <div id="overlay">
        <span>……？</span>
    </div>

    <!-- 使用 HTML5 标签直连音频，稳定性更高 -->
    <audio id="soundScare" src="scare_sound.mp3" preload="auto"></audio>
    <audio id="soundLoop" src="loop_sound.mp3" preload="auto" loop></audio>

    <script>
        // ==================== 文件名配置区域 ====================
        const fileConfig = {
            startImage: 'start.jpg',         // 1. 初始伪装图片文件
            scareImage1: 'scare1.jpg',       // 2. 跳脸图片 A 文件
            scareImage2: 'scare2.jpg',       // 3. 跳脸图片 B 文件
            recoverySeconds: 4               // 4. 几秒后恢复原样（单位：秒）
        };
        // ========================================================

        // 预加载图片
        [fileConfig.startImage, fileConfig.scareImage1, fileConfig.scareImage2].forEach(src => {
            const img = new Image();
            img.src = src;
        });

        let hasTriggered = false;
        let flashInterval = null;

        document.getElementById('overlay').addEventListener('click', function() {
            if (hasTriggered) return;
            hasTriggered = true;

            const overlay = this;
            overlay.innerHTML = ''; 

            // 获取音频标签
            const soundScare = document.getElementById('soundScare');
            const soundLoop = document.getElementById('soundLoop');

            // 1. 立即播放突脸音效
            soundScare.currentTime = 0;

            // 2. 错开 150 毫秒再播放循环音频，防止声音通道打架
            setTimeout(() => {
                soundLoop.currentTime = 0;
            }, 150);

            // 全屏
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) docEl.requestFullscreen();

            // 双图片高频闪烁
            let toggle = false;
            flashInterval = setInterval(() => {
                toggle = !toggle;
                overlay.style.backgroundImage = `url('${toggle ? fileConfig.scareImage1 : fileConfig.scareImage2}')`;
            }, 150);

            document.title = "连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️连哥哥也要放弃幺幺吗👁️";

            // 自动恢复
            setTimeout(() => {
                clearInterval(flashInterval);

                soundLoop.pause();
                soundLoop.currentTime = 0;
                soundScare.pause();
                soundScare.currentTime = 0;

                overlay.style.backgroundImage = `url('${fileConfig.startImage}')`;

                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                }

                document.title = "请你离开。";
            }, fileConfig.recoverySeconds * 1000);
        });
    </script>
</body>
</html>
